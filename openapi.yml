openapi: 3.1.0
info:
  title: Web Scraping and Crawling (API Commons)
  version: 0.1.0-draft.20261111
  description: 'The common Web Scraping and Crawling interface, distilled from the harvested OpenAPI of 109 providers
    in the APIs.io catalog. Not a product: no one serves this API. It is the shape the market already shares, measured,
    so that providers, agents and integrators can map to one vocabulary. See profile.yml.'
  license:
    name: CC BY-NC-SA 4.0
    url: https://creativecommons.org/licenses/by-nc-sa/4.0/
paths:
  /scrapes:
    post:
      operationId: createScrape
      summary: Create a scrape
      tags:
      - Scrapes
      x-commons-tier: core
      x-commons-share: 0.837
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: &id001
                $ref: '#/components/schemas/Scrape'
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
    get:
      operationId: listScrapes
      summary: List scrapes
      tags:
      - Scrapes
      x-commons-tier: extended
      x-commons-share: 0.347
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: *id001
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
  /crawls:
    post:
      operationId: createCrawl
      summary: Create a crawl
      tags:
      - Crawls
      x-commons-tier: core
      x-commons-share: 0.867
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: &id002
                $ref: '#/components/schemas/Crawl'
      requestBody:
        required: true
        content:
          application/json:
            schema: *id002
    get:
      operationId: listCrawls
      summary: List crawls
      tags:
      - Crawls
      x-commons-tier: extended
      x-commons-share: 0.4
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: *id002
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
      - name: cursor
        in: query
        schema:
          type: string
  /crawls/{crawl_id}:
    parameters:
    - $ref: '#/components/parameters/crawl_id'
    get:
      operationId: getCrawl
      summary: Get a crawl
      tags:
      - Crawls
      x-commons-tier: extended
      x-commons-share: 0.2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: *id002
components:
  schemas:
    Scrape:
      $ref: ./schema/scrape.json
    Crawl:
      $ref: ./schema/crawl.json
  parameters:
    scrape_id:
      name: scrape_id
      in: path
      required: true
      schema:
        type: string
    crawl_id:
      name: crawl_id
      in: path
      required: true
      schema:
        type: string
